# Test stack — run all suites inside Docker via WSL:
#
#   wsl -e bash -lc "cd /mnt/c/LocalProjects/Condensates && make test"
#   wsl -e bash -lc "cd /mnt/c/LocalProjects/Condensates && make test-integration"
#
# Individual targets: make test-python | test-ts | test-go | test-mcp

services:
  test-python:
    profiles: [test]
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://user:password@condensate-db:5432/condensate
      QDRANT_HOST: condensate-vector
      QDRANT_PORT: "6333"
      API_BASE_URL: http://condensate-core:8000
      PYTHONPATH: /app
    networks:
      - condensate_net
    entrypoint: ["pytest"]

  test-ts-sdk:
    profiles: [test]
    image: node:20-alpine
    working_dir: /workspace/sdks/ts
    volumes:
      - .:/workspace
    command: >
      sh -c "npm ci && npm run build && npm test"

  test-go-sdk:
    profiles: [test]
    image: golang:1.21-alpine
    working_dir: /workspace/sdks/go
    volumes:
      - .:/workspace
    command: >
      sh -c "go mod tidy && go test ./... -count=1 -v"

  test-mcp-bridge:
    profiles: [test]
    image: node:20-alpine
    working_dir: /workspace/sdks/mcp-bridge
    volumes:
      - .:/workspace
    command: >
      sh -c "npm ci && npm test"

  test-benchmarks:
    profiles: [test]
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONPATH: /app
    networks:
      - condensate_net
    entrypoint: ["python", "benchmarks/runners/run_locomo.py"]

  test-contradiction:
    profiles: [test]
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONPATH: /app
    entrypoint: ["python", "benchmarks/runners/run_contradiction.py"]

  lint-python:
    profiles: [test]
    build: .
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: []
    command: >
      sh -c "pip install -q ruff==0.11.12 bandit &&
      ruff check
      src/server
      src/config.py
      src/config_cache.py
      src/engine/condenser.py
      tests/test_proof_envelope.py
      tests/test_request_tracing.py
      tests/test_metrics.py
      tests/test_health.py
      tests/test_rate_limit.py
      tests/test_config_cache.py
      main.py &&
      ruff format --check
      src/server
      src/config.py
      src/config_cache.py
      src/engine/condenser.py
      tests/test_proof_envelope.py
      tests/test_request_tracing.py
      tests/test_metrics.py
      tests/test_health.py
      tests/test_rate_limit.py
      tests/test_config_cache.py
      main.py &&
      bandit -r src -c bandit.yaml -ll"

  lint-frontend:
    profiles: [test]
    image: node:20-alpine
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    command: >
      sh -c "npm ci && npm run lint && npm run format:check"

  npm-install-frontend:
    profiles: [test]
    image: node:20-alpine
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    command: npm install

  npm-install-mcp:
    profiles: [test]
    image: node:20-alpine
    working_dir: /workspace/sdks/mcp-bridge
    volumes:
      - .:/workspace
    command: npm install

  npm-audit-frontend:
    profiles: [test]
    image: node:20-alpine
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    command: >
      sh -c "npm ci && npm audit --audit-level=high"

  npm-audit-mcp:
    profiles: [test]
    image: node:20-alpine
    working_dir: /workspace/sdks/mcp-bridge
    volumes:
      - .:/workspace
    command: >
      sh -c "npm ci && npm audit --audit-level=high"
