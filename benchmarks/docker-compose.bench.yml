# Extends the main stack for benchmark runs against a live Condensate API.
services:
  condensate-core:
    # No --reload: checkpoint writes and long runs must not restart the API mid-request.
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      REVIEW_MODE: auto
      LLM_MAX_CONCURRENCY: "1"
      CONDENSE_BATCH_SIZE: "15"
      RETRIEVE_SKIP_RERANK: "1"
      RETRIEVE_BENCHMARK_MODE: "1"
      RETRIEVE_BENCHMARK_SKIP_GRAPH: "1"
      RETRIEVE_BENCHMARK_GRAPH_STEPS: "0"
      RETRIEVE_EMBED_CPU: "1"
      RETRIEVE_VECTOR_LIMIT: "36"
      RETRIEVE_RERANK_TOP_N: "35"
      RETRIEVE_ASSERTION_LIMIT: "40"
      RETRIEVE_ADVERSARIAL_RAW_LIMIT: "2"
      RETRIEVE_ENTITY_ALIGNMENT_FILTER: "1"
      RETRIEVE_SWAP_TRAP_FILTER: "1"
      RETRIEVE_MAX_CONTEXT_CHARS: "28000"

  condensate-ollama:
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"

  test-benchmarks:
    profiles: [test]
    environment:
      CONDENSATE_URL: http://condensate-core:8000
      CONDENSATE_API_KEY: ${CONDENSATE_API_KEY:-}
      CONDENSATE_SKIP_INGEST: ${CONDENSATE_SKIP_INGEST:-0}
      LOCOMO_BULK_CHUNK_SIZE: "15"
      CONDENSATE_HTTP_READ_TIMEOUT: "900"
      CONDENSATE_BULK_RETRIES: "6"
      CONDENSATE_RETRIEVE_RETRIES: "24"
      CONDENSATE_QA_DELAY_S: "0.25"
      CONDENSATE_CORE_WAIT_S: "600"
